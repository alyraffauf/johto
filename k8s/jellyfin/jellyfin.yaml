apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: jellyfin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jellyfin
    spec:
      nodeSelector:
        johto.narwhal-snapper-ts.net/workload: media
      securityContext:
        supplementalGroups: [26, 303]
      containers:
        - name: jellyfin
          image: jellyfin/jellyfin@sha256:aefb67e6a7ff1debdd154a78a7bbb780fd0c873d8639210a7f6a2016ad2b35db
          env:
            - name: JELLYFIN_PublishedServerUrl
              value: https://jellyfin.narwhal-snapper.ts.net
            - name: TZ
              value: America/New_York
          ports:
            - name: http
              containerPort: 8096
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 4Gi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /config
            - name: cache
              mountPath: /cache
            - name: media
              mountPath: /media
            - name: backblaze
              mountPath: /backblaze
            - name: dri
              mountPath: /dev/dri
      volumes:
        - name: config
          hostPath:
            path: /mnt/Data/jellyfin
            type: Directory
        - name: cache
          hostPath:
            path: /mnt/Data/jellyfin-cache
            type: Directory
        - name: media
          hostPath:
            path: /mnt/Media
            type: Directory
        - name: backblaze
          hostPath:
            path: /mnt/Backblaze
            type: Directory
        - name: dri
          hostPath:
            path: /dev/dri
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  selector:
    app.kubernetes.io/name: jellyfin
  ports:
    - name: http
      port: 8096
      targetPort: http
