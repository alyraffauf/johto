apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ombi
  namespace: flux-system
spec:
  chart:
    spec:
      chart: ./k8s/charts/ombi
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
      version: 0.1.0
  install:
    createNamespace: true
    remediation:
      retries: 3
  interval: 30m
  releaseName: ombi
  targetNamespace: ombi
  timeout: 10m
