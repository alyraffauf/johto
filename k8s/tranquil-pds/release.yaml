apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tranquil-pds
  namespace: flux-system
spec:
  chart:
    spec:
      chart: ./k8s/charts/tranquil-pds
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
      version: 0.1.0
  install:
    createNamespace: true
    remediation:
      retries: 3
  interval: 30m
  releaseName: tranquil-pds
  targetNamespace: tranquil-pds
  timeout: 10m
