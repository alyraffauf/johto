apiVersion: apps/v1
kind: Deployment
metadata:
  name: ombi
  labels:
    app: ombi
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ombi
  template:
    metadata:
      labels:
        app: ombi
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: database-configuration
          image: {{ .Values.image | quote }}
          command:
            - sh
            - -c
            - cp /credentials/database.json /config/database.json
          volumeMounts:
            - name: config
              mountPath: /config
            - name: database-configuration
              mountPath: /credentials
              readOnly: true
      containers:
        - name: ombi
          image: {{ .Values.image | quote }}
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: America/New_York
          ports:
            - name: http
              containerPort: 3579
          resources: {{ .Values.resources | toYaml | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /config
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: config
          emptyDir: {}
        - name: database-configuration
          secret:
            secretName: ombi-database-configuration
