apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pocket-id
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        {{- toYaml .Values.hosts | nindent 8 }}
      secretName: {{ .Values.certificate.secretName }}
  rules:
    {{- range .Values.hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pocket-id
                port:
                  number: 80
    {{- end }}
