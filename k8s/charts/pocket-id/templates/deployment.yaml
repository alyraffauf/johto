apiVersion: apps/v1
kind: Deployment
metadata:
  name: pocket-id
  labels:
    app: pocket-id
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pocket-id
  template:
    metadata:
      labels:
        app: pocket-id
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: pocket-id
          image: {{ .Values.image | quote }}
          env:
            - name: APP_URL
              value: {{ .Values.appUrl | quote }}
            - name: TRUST_PROXY
              value: "true"
            - name: FILE_BACKEND
              value: database
          envFrom:
            - secretRef:
                name: pocket-id-env
          ports:
            - name: http
              containerPort: 1411
          resources: {{ .Values.resources | toYaml | nindent 12 }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 60
            timeoutSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 2
