apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: switchyard
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - {{ .Values.host | quote }}
      secretName: {{ .Values.certificate.secretName }}
  rules:
    - host: {{ .Values.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: switchyard
                port:
                  name: http
