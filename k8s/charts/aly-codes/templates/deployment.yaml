apiVersion: apps/v1
kind: Deployment
metadata:
  name: aly-codes
  labels:
    app: aly-codes
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: aly-codes
  template:
    metadata:
      labels:
        app: aly-codes
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: aly-codes
      containers:
        - name: aly-codes
          image: {{ .Values.image | quote }}
          ports:
            - name: http
              containerPort: 80
          resources: {{ .Values.resources | toYaml | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
