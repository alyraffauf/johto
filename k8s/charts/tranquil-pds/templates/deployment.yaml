apiVersion: apps/v1
kind: Deployment
metadata:
  name: tranquil-pds
  labels:
    app: tranquil-pds
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: tranquil-pds
  template:
    metadata:
      labels:
        app: tranquil-pds
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      imagePullSecrets:
        - name: tranquil-pds-atcr-pull
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: tranquil-pds
      containers:
        - name: tranquil-pds
          image: {{ .Values.image | quote }}
          env:
            - name: AWS_REGION
              value: us-east-005
            - name: BLOB_STORAGE_BACKEND
              value: s3
            - name: CACHE_BACKEND
              value: valkey
            - name: CRAWLERS
              value: https://bsky.network
            - name: INVITE_CODE_REQUIRED
              value: "true"
            - name: MAIL_FROM_ADDRESS
              value: admin@aly.social
            - name: MAIL_FROM_NAME
              value: tranquil
            - name: MAIL_SMARTHOST_HOST
              value: smtp.resend.com
            - name: MAIL_SMARTHOST_PORT
              value: "2465"
            - name: MAIL_SMARTHOST_TLS
              value: implicit
            - name: MAIL_SMARTHOST_USERNAME
              value: resend
            - name: MAX_CONCURRENT_REPO_EXPORTS
              value: "8"
            - name: PDS_HOSTNAME
              value: pds.cute.haus
            - name: PDS_USER_HANDLE_DOMAINS
              value: aly.social
            - name: PLC_DIRECTORY_URL
              value: https://plc.directory
            - name: S3_BUCKET
              value: aly-tranquil-blobs
            - name: S3_ENDPOINT
              value: https://s3.us-east-005.backblazeb2.com
            - name: SERVER_HOST
              value: 0.0.0.0
            - name: SERVER_PORT
              value: "3000"
            - name: SKIP_IMPORT_VERIFICATION
              value: "false"
            - name: SSO_OIDC_DISPLAY_NAME
              value: cute.haus
            - name: SSO_OIDC_ENABLED
              value: "true"
            - name: SSO_OIDC_ISSUER
              value: https://id.cute.haus
            - name: VALKEY_URL
              value: redis://tranquil-pds-valkey:6379/5
          envFrom:
            - secretRef:
                name: tranquil-pds-env
            - secretRef:
                name: tranquil-pds-sso-env
          ports:
            - name: http
              containerPort: 3000
          resources: {{ .Values.resources | toYaml | nindent 12 }}
          startupProbe:
            httpGet:
              path: /xrpc/_health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /xrpc/_health
              port: http
            periodSeconds: 60
            timeoutSeconds: 15
          readinessProbe:
            httpGet:
              path: /xrpc/_health
              port: http
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: tranquil-pds
  labels:
    app: tranquil-pds
spec:
  selector:
    app: tranquil-pds
  ports:
    - name: http
      port: 80
      targetPort: http
