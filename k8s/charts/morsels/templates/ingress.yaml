apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: morsels
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        {{- range .Values.hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .Values.certificate.secretName }}
  rules:
    {{- range .Values.hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: morsels
                port:
                  name: http
    {{- end }}
