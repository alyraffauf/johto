apiVersion: tailscale.com/v1alpha1
kind: ProxyClass
metadata:
  name: private-ingress
spec:
  statefulSet:
    pod:
      nodeSelector:
        johto.narwhal-snapper-ts.net/workload: ingress
      tolerations:
        - effect: NoSchedule
          key: johto.narwhal-snapper-ts.net/workload
          operator: Equal
          value: ingress
---
apiVersion: tailscale.com/v1alpha1
kind: ProxyGroup
metadata:
  name: private-ingress
spec:
  proxyClass: private-ingress
  replicas: 1
  type: ingress
