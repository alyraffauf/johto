apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: sinnoh-public-ingress
  namespace: kube-system
spec:
  secretName: sinnoh-public-ingress-tls
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt
  dnsNames:
    - aly.codes
    - www.aly.codes
    - status.aly.codes
    - switchyard.aly.codes
    - vibes.aly.codes
---
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    tlsStore:
      default:
        defaultCertificate:
          secretName: sinnoh-public-ingress-tls
