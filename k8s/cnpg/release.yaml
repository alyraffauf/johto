apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg
  namespace: flux-system
spec:
  chart:
    spec:
      chart: cloudnative-pg
      sourceRef:
        kind: HelmRepository
        name: cloudnative-pg
      version: 0.29.0
  install:
    crds: CreateReplace
  interval: 30m
  releaseName: cloudnative-pg
  targetNamespace: cnpg-system
  values:
    nodeSelector:
      johto.narwhal-snapper-ts.net/workload: media
