apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nextcloud
  namespace: flux-system
spec:
  dependsOn:
    - name: cnpg
    - name: postgres
    - name: secrets
  interval: 10m
  path: ./k8s/nextcloud
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 10m
  # The Collabora configuration Job is retried independently; it must not
  # block deployment reconciliation when a transient dependency is starting.
  wait: false
