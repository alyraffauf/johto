apiVersion: v1
kind: Namespace
metadata:
  name: slingshot
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: slingshot
  namespace: slingshot
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: slingshot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: slingshot
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        johto.narwhal-snapper-ts.net/workload: media
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: slingshot
          image: ghcr.io/alyraffauf/slingshot:latest@sha256:7d61eb695786dbc97a67ebd43a4680298f367fee9d9440ae7b9559b76b40ba2f
          env:
            - name: SLINGSHOT_CACHE_DIR
              value: /cache
            - name: SLINGSHOT_IDENTITY_CACHE_DISK_DB
              value: "2"
            - name: SLINGSHOT_IDENTITY_CACHE_MEMORY_MB
              value: "64"
            - name: SLINGSHOT_JETSTREAM
              value: wss://jetstream1.us-east.bsky.network/subscribe
            - name: SLINGSHOT_RECORD_CACHE_DISK_DB
              value: "4"
            - name: SLINGSHOT_RECORD_CACHE_MEMORY_MB
              value: "256"
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: cache
              mountPath: /cache
      volumes:
        - name: cache
          emptyDir:
            sizeLimit: 8Gi
---
apiVersion: v1
kind: Service
metadata:
  name: slingshot
  namespace: slingshot
spec:
  selector:
    app.kubernetes.io/name: slingshot
  ports:
    - name: http
      port: 80
      targetPort: http
