apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-shared
  namespace: cnpg-system
spec:
  affinity:
    nodeSelector:
      johto.narwhal-snapper-ts.net/workload: media
  bootstrap:
    initdb:
      database: media
      owner: media
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6@sha256:d7a81cb5da3182d95d0da5fabfb9e484e375db899dcd54b684105f1e8966e9ca
  instances: 1
  managed:
    roles:
      - name: nextcloud
        login: true
        passwordSecret:
          name: nextcloud-postgres
      - name: paperless
        login: true
        passwordSecret:
          name: paperless-postgres
  storage:
    size: 20Gi
