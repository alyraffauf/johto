apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pocket-id
  namespace: flux-system
spec:
  chart:
    spec:
      chart: ./k8s/charts/pocket-id
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
      version: 0.1.1
  install:
    createNamespace: true
    remediation:
      retries: 3
  interval: 30m
  releaseName: pocket-id
  targetNamespace: identity
  timeout: 10m
