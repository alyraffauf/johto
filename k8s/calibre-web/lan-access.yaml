apiVersion: apps/v1
kind: Deployment
metadata:
  name: calibre-web
  namespace: calibre-web
spec:
  template:
    spec:
      containers:
        - name: calibre-web
          ports:
            - containerPort: 8083
              # Keep the reader's HTTP endpoint on Goldenrod's LAN address.
              hostIP: 192.168.1.138
              hostPort: 8083
