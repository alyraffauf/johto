apiVersion: v1
kind: Namespace
metadata:
  name: websites
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: watsup-config
  namespace: websites
data:
  watsup.toml: |
    title = "watsup"

    [[sections]]
    type = "widgets"
    columns = 4

    [[sections.widgets]]
    type = "weather"

    [[sections.widgets]]
    type = "search"
    span = 3

    [[sections]]
    type = "widgets"
    columns = 2

    [[sections.widgets]]
    type = "lobsters"
    title = "Lobsters"

    [[sections.widgets]]
    type = "hacker-news"
    title = "Hacker News"

    [[sections]]
    type = "services"
    title = "Johto"
    columns = 4

    [[sections.services]]
    name = "Immich"
    url = "https://immich.cute.haus"
    icon = "https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/immich.png"

    [[sections.services]]
    name = "Nextcloud"
    url = "https://nextcloud.cute.haus"
    icon = "https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/nextcloud.png"

    [[sections.services]]
    name = "Paperless"
    url = "https://paperless.cute.haus"
    icon = "https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/paperless-ngx.png"

    [[sections.services]]
    name = "Plex"
    url = "https://plex.cute.haus"
    icon = "https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/plex.png"

    [[sections.services]]
    name = "Uptime Kuma"
    url = "https://kuma.cute.haus"
    icon = "https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/uptime-kuma.png"

    [[sections.services]]
    name = "Navidrome"
    url = "https://navidrome.narwhal-snapper.ts.net"
    icon = "https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/navidrome.png"

    [[sections.services]]
    name = "Prowlarr"
    url = "https://prowlarr.narwhal-snapper.ts.net"
    icon = "https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/prowlarr.png"

    [[sections.services]]
    name = "Radarr"
    url = "https://radarr.narwhal-snapper.ts.net"
    icon = "https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/radarr.png"

    [[sections.services]]
    name = "Sonarr"
    url = "https://sonarr.narwhal-snapper.ts.net"
    icon = "https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/sonarr.png"

    [[sections.services]]
    name = "Lidarr"
    url = "https://lidarr.narwhal-snapper.ts.net"
    icon = "https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/lidarr.png"

    [[sections.services]]
    name = "Bazarr"
    url = "https://bazarr.narwhal-snapper.ts.net"
    icon = "https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/bazarr.png"

    [[sections.services]]
    name = "Tautulli"
    url = "https://tautulli.narwhal-snapper.ts.net"
    icon = "https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/tautulli.png"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: watsup
  namespace: websites
spec:
  replicas: 1
  selector:
    matchLabels:
      app: watsup
  template:
    metadata:
      labels:
        app: watsup
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        johto.narwhal-snapper-ts.net/workload: media
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: watsup
          image: ghcr.io/alyraffauf/watsup:latest@sha256:f28824be43af70f7a163dfa8056b77fadd0fa59f95cad1d713e8cad35c529b18
          imagePullPolicy: IfNotPresent
          env:
            - name: WATSUP_CONFIG_PATH
              value: /run/configs/watsup.toml
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests:
              cpu: 10m
              memory: 96Mi
            limits:
              cpu: 100m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /run/configs/watsup.toml
              subPath: watsup.toml
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: watsup-config
---
apiVersion: v1
kind: Service
metadata:
  name: watsup
  namespace: websites
spec:
  selector:
    app: watsup
  ports:
    - name: http
      port: 80
      targetPort: http
