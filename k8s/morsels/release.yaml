apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: morsels
  namespace: flux-system
spec:
  chart:
    spec:
      chart: ./k8s/charts/morsels
      sourceRef:
        kind: GitRepository
        name: flux-system
      version: 0.1.0
  install:
    createNamespace: true
    remediation:
      retries: 3
  interval: 30m
  releaseName: morsels
  targetNamespace: morsels
  timeout: 10m
