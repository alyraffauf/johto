apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: immich-cute-haus
  namespace: immich
spec:
  dnsNames:
    - immich.cute.haus
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt
  secretName: immich-cute-haus-tls
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: immich
  namespace: immich
spec:
  ingressClassName: traefik
  rules:
    - host: immich.cute.haus
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: immich
                port:
                  name: http
  tls:
    - hosts:
        - immich.cute.haus
      secretName: immich-cute-haus-tls
