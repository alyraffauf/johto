apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: slingshot-cute-haus
  namespace: slingshot
spec:
  dnsNames:
    - slingshot.cute.haus
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt
  secretName: slingshot-cute-haus-tls
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: slingshot
  namespace: slingshot
spec:
  ingressClassName: traefik
  rules:
    - host: slingshot.cute.haus
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: slingshot
                port:
                  name: http
  tls:
    - hosts:
        - slingshot.cute.haus
      secretName: slingshot-cute-haus-tls
