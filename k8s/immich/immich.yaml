apiVersion: v1
kind: Service
metadata:
  name: immich
  namespace: immich
spec:
  selector:
    app: immich
  ports:
    - name: http
      port: 2283
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: immich
spec:
  selector:
    app: valkey
  ports:
    - port: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: machine-learning
  namespace: immich
spec:
  selector:
    app: machine-learning
  ports:
    - name: http
      port: 3003
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  namespace: immich
spec:
  replicas: 1
  selector:
    matchLabels:
      app: valkey
  template:
    metadata:
      labels:
        app: valkey
    spec:
      enableServiceLinks: false
      nodeSelector:
        johto.narwhal-snapper-ts.net/workload: media
      containers:
        - name: valkey
          image: valkey/valkey:9-alpine@sha256:a0dbf4c1d5708782907c10e2c72deff317518518b5288a58416981d9db95d30b
          args:
            [
              valkey-server,
              --save,
              "",
              --maxmemory,
              1gb,
              --maxmemory-policy,
              noeviction,
            ]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: machine-learning
  namespace: immich
spec:
  replicas: 1
  selector:
    matchLabels:
      app: machine-learning
  template:
    metadata:
      labels:
        app: machine-learning
    spec:
      enableServiceLinks: false
      nodeSelector:
        johto.narwhal-snapper-ts.net/workload: media
      containers:
        - name: machine-learning
          image: ghcr.io/immich-app/immich-machine-learning:v3.2.0-openvino@sha256:11bcbc9a17c5901b5ee382090ff917a40d0ece703a4c60b0cefe4e9f0e1d4fa5
          env:
            - { name: MACHINE_LEARNING_CACHE_FOLDER, value: /cache }
          ports:
            - { name: http, containerPort: 3003 }
          resources:
            limits:
              memory: 4Gi
          volumeMounts:
            - name: cache
              mountPath: /cache
            - name: dri
              mountPath: /dev/dri
      volumes:
        - name: cache
          hostPath:
            path: /mnt/Data/cache/immich
            type: Directory
        - name: dri
          hostPath:
            path: /dev/dri
            type: Directory
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich
  namespace: immich
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: immich
  template:
    metadata:
      labels:
        app: immich
    spec:
      enableServiceLinks: false
      nodeSelector:
        johto.narwhal-snapper-ts.net/workload: media
      containers:
        - name: immich
          image: ghcr.io/immich-app/immich-server:v3.2.0@sha256:ae13784ffcfcce8f4178113eb6661602a1fd1912f3d539880b8ac0dd95fc8ac2
          env:
            - { name: DB_DATABASE_NAME, value: immich }
            - { name: DB_HOSTNAME, value: postgres }
            - { name: DB_PORT, value: "5432" }
            - { name: DB_USERNAME, value: immich }
            - { name: IMMICH_CONFIG_FILE, value: /etc/immich/config.json }
            - {
                name: IMMICH_MACHINE_LEARNING_URL,
                value: http://machine-learning:3003,
              }
            - { name: REDIS_DBINDEX, value: "4" }
            - { name: REDIS_HOSTNAME, value: valkey }
            - { name: TZ, value: America/New_York }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-env
                  key: DB_PASSWORD
          ports:
            - { name: http, containerPort: 2283 }
          resources:
            limits:
              memory: 4Gi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/immich
              readOnly: true
      volumes:
        - name: data
          hostPath:
            path: /mnt/Data/apps/immich
            type: Directory
        - name: config
          secret:
            secretName: immich-config
            items:
              - key: config.json
                path: config.json
