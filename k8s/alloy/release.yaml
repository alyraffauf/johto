apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: flux-system
spec:
  chart:
    spec:
      chart: alloy
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      version: 1.12.1
  install:
    createNamespace: true
    remediation:
      retries: 3
  interval: 30m
  releaseName: alloy
  targetNamespace: alloy-system
  upgrade:
    remediation:
      retries: 3
  values:
    alloy:
      configMap:
        content: |-
          discovery.kubernetes "traefik" {
            role = "pod"

            namespaces {
              names = ["kube-system"]
            }

            selectors {
              role  = "pod"
              label = "app.kubernetes.io/name=traefik"
            }
          }

          discovery.relabel "traefik" {
            targets = discovery.kubernetes.traefik.targets

            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "pod"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              target_label  = "container"
            }

            rule {
              source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
              separator     = "/"
              target_label  = "job"
            }
          }

          loki.source.kubernetes "traefik" {
            targets    = discovery.relabel.traefik.output
            forward_to = [loki.process.traefik.receiver]
          }

          loki.process "traefik" {
            stage.static_labels {
              values = {
                cluster = "johto",
              }
            }

            forward_to = [loki.write.johto.receiver]
          }

          loki.write "johto" {
            endpoint {
              url = "http://10.254.2.3:3030/loki/api/v1/push"
            }
          }
      enableReporting: false
      resources:
        limits:
          cpu: 200m
          memory: 256Mi
        requests:
          cpu: 10m
          memory: 64Mi
    controller:
      type: deployment
      replicas: 1
    crds:
      create: false
    image:
      tag: v1.19.2
      digest: sha256:b8ec653c44235fbe910879145dac3597d66b0aaecf60bcbbe82580767771a839
