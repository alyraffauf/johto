apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: forgejo-johto
  namespace: forgejo
  annotations:
    tailscale.com/proxy-group: private-ingress
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - forgejo
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: forgejo
                port:
                  name: http
