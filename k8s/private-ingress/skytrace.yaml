apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: skytrace-johto
  namespace: skytrace
  annotations:
    tailscale.com/proxy-group: private-ingress
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - skytrace
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: skytrace
                port:
                  name: http
