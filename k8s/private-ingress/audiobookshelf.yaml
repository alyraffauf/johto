apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: audiobookshelf-johto
  namespace: audiobookshelf
  annotations:
    tailscale.com/proxy-group: private-ingress
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - audiobookshelf
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: audiobookshelf
                port:
                  name: http
