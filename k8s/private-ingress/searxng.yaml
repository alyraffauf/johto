apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: searxng-johto
  namespace: searxng
  annotations:
    tailscale.com/proxy-group: private-ingress
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - searxng
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: searxng
                port:
                  name: http
