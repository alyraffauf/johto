apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: calibre-web-johto
  namespace: calibre-web
  annotations:
    tailscale.com/proxy-group: private-ingress
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - calibre
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: calibre-web
                port:
                  name: http
