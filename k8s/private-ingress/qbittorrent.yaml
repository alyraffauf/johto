apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qbittorrent-johto
  namespace: arr
  annotations:
    tailscale.com/proxy-group: private-ingress
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - qbittorrent
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: qbittorrent
                port:
                  name: webui
