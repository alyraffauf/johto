apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prowlarr-johto
  namespace: media
  annotations:
    tailscale.com/proxy-group: private-ingress
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - prowlarr
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prowlarr
                port:
                  name: http
