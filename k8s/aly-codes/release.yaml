apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: aly-codes
  namespace: flux-system
spec:
  chart:
    spec:
      chart: ./k8s/charts/aly-codes
      sourceRef:
        kind: GitRepository
        name: flux-system
      version: 0.1.0
  install:
    createNamespace: true
    remediation:
      retries: 3
  interval: 30m
  releaseName: aly-codes
  targetNamespace: aly-codes
  timeout: 10m
